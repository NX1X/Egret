# Security stack - CodeQL (Go), zizmor, OpenSSF Scorecard, dependency review,
# and govulncheck. Complements ci.yml.

name: Security

# NO `paths-ignore` here, deliberately: `zizmor (workflow lint)`, `govulncheck`,
# `CodeQL (Go, security-extended)` and `Dependency Review` are REQUIRED status
# checks in the `main branch protection` ruleset. A path filter makes a skipped
# workflow never report those contexts, leaving a docs-only PR permanently stuck
# on "Expected". See the same note in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (workflow lint)
    runs-on: ubuntu-latest
    # ~0.3m observed.
    timeout-minutes: 6
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        timeout-minutes: 4
        # Pinned: an unpinned installer in the security workflow is both an
        # unreviewed supply-chain input and a source of findings that appear or
        # vanish between runs with no repo change. Renovate bumps this.
        run: pipx install zizmor==1.30.1

      - name: Run zizmor
        # zizmor exits non-zero when it FINDS issues - those still surface via the
        # SARIF upload below, so we don't want that to fail the job. But a genuine
        # tool failure (bad install, crash, unparseable workflow) must NOT pass
        # silently behind `|| true`: require a valid, non-empty SARIF document and
        # only tolerate the findings-present case.
        run: |
          set +e
          zizmor --format sarif .github/workflows > zizmor.sarif
          rc=$?
          set -e
          if ! python3 -c 'import json; json.load(open("zizmor.sarif"))' 2>/dev/null; then
            echo "::error::zizmor did not produce a valid SARIF report (exit ${rc}); treating this as a tool failure, not a clean run."
            exit 1
          fi
          echo "zizmor completed (exit ${rc}); findings, if any, are in the SARIF upload."

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zizmor.sarif

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard grades the REPOSITORY, not a diff: on a pull_request the score is
    # meaningless and `publish_results` can't publish anyway (publishing requires a
    # default-branch run). Restricting it to the default branch + the weekly
    # schedule drops a job from every PR without losing any signal.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # ~0.3m observed.
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run scorecard
        timeout-minutes: 8
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ~0.1m observed.
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        timeout-minutes: 4
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # The ONLY govulncheck run in the repo. It used to be duplicated as a step in
  # ci.yml's `ebpf` job, which scanned the same commit twice and rebuilt the tool
  # from source twice on every push and PR.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # ~0.5m observed (most of it building the tool on a cache miss).
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      GOVULNCHECK_VERSION: v1.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.1"

      # Built from source every run, deliberately NOT cached. Caching the binary
      # would save ~25s, but this is the scanner that gates the merge: a cache is
      # writable by any run on the same ref, so a restored `govulncheck` that
      # reports "no vulnerabilities" is a strictly worse failure than a slow one.
      # Same reasoning as the `cache: false` on the release trust path. `go install`
      # at a pinned version is checksum-verified through the Go module proxy.
      # The duplicate run in ci.yml is gone, which is where the real time went.
      - name: Install govulncheck
        timeout-minutes: 5
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Run govulncheck
        # Fails CI on known-vulnerable dependencies (see docs/DEPENDENCIES.md).
        timeout-minutes: 6
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  codeql:
    name: CodeQL (Go, security-extended)
    runs-on: ubuntu-latest
    # ~1.3m observed - the longest job in the repo. 12m leaves room for a cold
    # CodeQL bundle download and a slow autobuild without waiting out 20m on a hang.
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build cross-platform packages so CodeQL analyses the non-Linux build
      # paths without needing clang / eBPF codegen on the runner.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: "1.27.1"

      - name: Initialize CodeQL
        timeout-minutes: 6
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          queries: security-extended

      - name: Analyze
        timeout-minutes: 10
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
