# SonarCloud automatic analysis settings.
#
# The eBPF bindings in internal/collector/*_bpfel.go and *_bpfeb.go are
# generated by bpf2go (`make generate`), one file per byte order, so each pair
# is identical by design. Exclude them from duplication and analysis; the C
# sources in internal/bpf/ are the reviewed code.
sonar.exclusions=internal/collector/*_bpfel.go,internal/collector/*_bpfeb.go
sonar.cpd.exclusions=internal/collector/*_bpfel.go,internal/collector/*_bpfeb.go
